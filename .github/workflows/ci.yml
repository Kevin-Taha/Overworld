name: Windows deterministic tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: MSVC x64 / voice-off
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: |
          cmake -S . -B out\x64 -G "Visual Studio 17 2022" -A x64 -DOVERWORLD_VOICE_WHISPER=OFF
          if ($LASTEXITCODE) { throw 'Configure failed.' }
      - name: Build
        run: |
          cmake --build out\x64 --config Release --parallel 2 -- /nodeReuse:false
          if ($LASTEXITCODE) { throw 'Build failed.' }
      - name: Run deterministic tests
        run: |
          ctest --test-dir out\x64 -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Deterministic tests failed.' }
